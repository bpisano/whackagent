# whackagent board hooks — reusable logic, board contract 2.2 (templates/BOARD.md, installed in each project as
# BOARD.md). Projects never copy this file: their caller (providers/github/whackagent-board.yml, installed by
# /wa-setup) holds the triggers, permissions and concurrency, and runs this through
# `uses: rlatapy-luna/whackagent/.github/workflows/board.yml@hooks-v2`. Each release moves `hooks-v2`, so every
# project runs the new logic on its next event; `hooks-v1` stays frozen for callers not yet upgraded. A change
# callers must follow (new trigger, permission, secret) needs a new tag `hooks-v3` and a new caller template version.
# Moves tickets on the GitHub Project from repository events, so the board follows the code:
#   issue opened / body edited             → todo; grilled when the body holds a non-empty `## Acceptance criteria`,
#                                            the ticket is todo/grilling and the editor can push (releases the
#                                            grilling claim); an outsider's criteria are reported, never taken
#   push to wa/<n>-<slug> holding its spec → grilled (releases the grilling claim)
#   PR → ticket                            = the one issue of this repository the PR links, else the one
#                                            `Closes #n` in its body, else branch wa/<n>-…; an open PR found the
#                                            second or third way gets the Development link (any base branch)
#   PR opened / reopened, draft or not      → review (releases the claims); card watched ~30 s against GitHub's
#                                            built-in "Pull request linked to issue" workflow
#   PR edited, link found late              → review, when the card still sits in todo/grilled
#   draft marked ready / back to draft      → nothing moves (already review)
#   push to an open PR while coding claimed → review (end of an agent round); new `## Feedback`
#                                            rounds of the task file linked (line permalinks) on the ticket and the PR
#   push to a ticket PR, no coding claim    → reported on the PR, board untouched
#   PR merged (any base)                   → done, issue closed, run report of the PR body (between
#                                            <!-- wa-report --> markers) posted on it; sprint parent closed when the
#                                            sprint has no branch and its last sub-issue is done. Stacked PR: landed
#                                            on its GitHub stack's base, not on the parent branch it targeted
#   sprint branch PR merged                → sprint parent issue closed (sprint landed)
#   PR closed unmerged                     → grilled, unless a coding claim or another open PR keeps the ticket going
#   schedule / manual run                  → report-only check: board vs repository, one comment per problem on the
#                                            ticket (resolved in place once fixed) + job summary; never moves cards.
#                                            Includes claims held with no push for WA_STALE_AFTER_HOURS (default 24)
# `coding` = an agent holds the ticket and works on it. Every round ends with a push or a release,
# so the ticket waits for humans (test, feedback, merge) in `review`, never in `coding`.
# Settings are the caller repository's variables (`vars`), written by `wa-backlog provision`. Projects v2
# reads and writes need the WA_PROJECT_TOKEN secret (classic PAT, scopes: project, repo), passed by the caller:
# `secrets: inherit` only works inside one owner, so the caller names it. Everything else uses the
# caller's GITHUB_TOKEN.

name: whackagent board

on:
  workflow_call:
    secrets:
      WA_PROJECT_TOKEN:
        required: false

jobs:
  board:
    if: vars.WA_PROJECT_NUMBER != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        env:
          WA_PROJECT_TOKEN: ${{ secrets.WA_PROJECT_TOKEN }}
          WA_PROJECT_OWNER: ${{ vars.WA_PROJECT_OWNER }}
          WA_PROJECT_NUMBER: ${{ vars.WA_PROJECT_NUMBER }}
          WA_STATUS_FIELD: ${{ vars.WA_STATUS_FIELD }}
          WA_STATES: ${{ vars.WA_STATES }}
          WA_TASKS_PATH: ${{ vars.WA_TASKS_PATH }}
          WA_BRANCH_PREFIX: ${{ vars.WA_BRANCH_PREFIX }}
          WA_SPRINT_PREFIX: ${{ vars.WA_SPRINT_PREFIX }}
          WA_STALE_AFTER_HOURS: ${{ vars.WA_STALE_AFTER_HOURS }}
        with:
          script: |
            const env = process.env;
            if (!env.WA_PROJECT_TOKEN) {
              core.setFailed("WA_PROJECT_TOKEN secret missing: classic PAT with scopes project + repo");
              return;
            }
            // Second client on the PAT: GITHUB_TOKEN can't reach Projects v2. Same class as `github`.
            const projects = new github.constructor({ auth: env.WA_PROJECT_TOKEN });
            const { owner, repo } = context.repo;
            const prefix = env.WA_BRANCH_PREFIX || "wa/";
            // "none" = sprints have no branch (branch.sprint_prefix: ""): an empty variable reads as unset
            const sprintPrefix = env.WA_SPRINT_PREFIX === "none" ? "" : (env.WA_SPRINT_PREFIX || "sprint/");
            const SPRINT_LABEL = "wa-sprint";
            const tasksPath = (env.WA_TASKS_PATH || ".whackagent/tasks").replace(/\/$/, "");
            const statusField = env.WA_STATUS_FIELD || "Status";
            const states = {
              todo: "Todo", grilling: "Grilling", grilled: "Grilled", coding: "Coding",
              "review": "Review", done: "Done",
              ...JSON.parse(env.WA_STATES || "{}"),
            };

            const escape = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const issueFromBranch = (branch) => {
              const match = branch.match(new RegExp(`^${escape(prefix)}(\\d+)-`));
              return match ? Number(match[1]) : null;
            };

            let projectCache;
            async function project() {
              if (projectCache) return projectCache;
              const data = await projects.graphql(
                `query($l:String!,$n:Int!,$f:String!){repositoryOwner(login:$l){... on ProjectV2Owner{
                  projectV2(number:$n){id field(name:$f){... on ProjectV2SingleSelectField{id options{id name}}}}}}}`,
                { l: env.WA_PROJECT_OWNER || owner, n: Number(env.WA_PROJECT_NUMBER), f: statusField });
              const p = data.repositoryOwner.projectV2;
              if (!p || !p.field) throw new Error(`project or field ${statusField} not found`);
              const byName = Object.fromEntries(p.field.options.map((o) => [o.name, o.id]));
              projectCache = { id: p.id, field: p.field.id, byName };
              return projectCache;
            }

            async function item(number) {
              const p = await project();
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: number });
              const added = await projects.graphql(
                `mutation($p:ID!,$c:ID!,$f:String!){addProjectV2ItemById(input:{projectId:$p,contentId:$c}){item{id
                  fieldValueByName(name:$f){... on ProjectV2ItemFieldSingleSelectValue{name}}}}}`,
                { p: p.id, c: issue.node_id, f: statusField });
              const node = added.addProjectV2ItemById.item;
              const current = node.fieldValueByName?.name;
              const state = Object.keys(states).find((s) => states[s] === current) || null;
              // column set but state null = a column whackagent doesn't own (Blocked, …): hands off
              return { id: node.id, state, column: current || null, issue };
            }

            async function setState(ticket, state) {
              const p = await project();
              await projects.graphql(
                `mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){updateProjectV2ItemFieldValue(input:{
                  projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$o}}){projectV2Item{id}}}`,
                { p: p.id, i: ticket.id, f: p.field, o: p.byName[states[state]] });
              core.info(`#${ticket.issue.number}: ${ticket.state ?? "none"} → ${state}`);
            }

            async function claimExists(number, phase) {
              try {
                await github.rest.git.getRef({ owner, repo, ref: `wa-claims/${number}/${phase}` });
                return true;
              } catch (e) { if (e.status === 404) return false; throw e; }
            }

            async function release(number, phase) {
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `wa-claims/${number}/${phase}` });
              } catch (e) { if (![404, 422].includes(e.status)) throw e; }
            }

            const comment = (number, body) =>
              github.rest.issues.createComment({ owner, repo, issue_number: number, body });

            // Contract breaks are reported, never repaired: one comment per problem, keyed by a hidden marker,
            // flipped to resolved in place once the problem clears (scheduled check).
            const marker = (kind) => `<!-- board-check:${kind} -->`;
            const contractUrl = `${context.serverUrl}/${owner}/${repo}/blob/HEAD/BOARD.md`;
            async function report(number, kind, text, existing) {
              const comments = existing ?? await github.paginate(github.rest.issues.listComments,
                { owner, repo, issue_number: number, per_page: 100 });
              if (comments.some((c) => c.body?.includes(marker(kind)))) return;
              await comment(number, `${marker(kind)}\n⚠️ **board check** — ${text}. See [BOARD.md](${contractUrl}); this check only reports, it never moves cards.`);
            }
            async function resolve(commentId, body, kind) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: commentId,
                body: body.replace(marker(kind), `<!-- board-check:${kind}:resolved -->`)
                  .replace("⚠️ **board check**", "✅ **board check — resolved**") });
            }

            // A merged PR's `Closes #n` closes the issue itself, racing this call: 422 then means already closed.
            async function closeIssue(number) {
              try {
                await github.rest.issues.update({ owner, repo, issue_number: number, state: "closed", state_reason: "completed" });
              } catch (e) {
                if (e.status !== 422) throw e;
                const { data } = await github.rest.issues.get({ owner, repo, issue_number: number });
                if (data.state !== "closed") throw e;
              }
            }

            // Sprint = parent issue labeled wa-sprint; sprint name = its title in kebab-case; tickets are its sub-issues.
            const sprintName = (title) => title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
            async function closeSprint(number, why) {
              await closeIssue(number);
              await comment(number, `🏁 **sprint landed** — ${why}`);
            }

            async function sprintParent(number) {
              const data = await github.graphql(
                `query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){issue(number:$n){
                  parent{number title state labels(first:20){nodes{name}}}}}}`,
                { o: owner, r: repo, n: number });
              const parent = data.repository.issue.parent;
              return parent && parent.labels.nodes.some((l) => l.name === SPRINT_LABEL) ? parent : null;
            }

            async function taskFile(number, sha) {
              let listing;
              try {
                ({ data: listing } = await github.rest.repos.getContent({ owner, repo, path: tasksPath, ref: sha }));
              } catch (e) { if (e.status === 404) return null; throw e; }
              const file = (Array.isArray(listing) ? listing : []).find((f) => new RegExp(`^${number}-.*\\.md$`).test(f.name));
              if (!file) return null;
              const { data } = await github.rest.repos.getContent({ owner, repo, path: file.path, ref: sha });
              const text = Buffer.from(data.content, "base64").toString("utf8");
              if (!new RegExp(`^issue:\\s*#?${number}\\s*$`, "m").test(text)) {
                core.notice(`${file.path}: frontmatter issue: does not match #${number}`);
                return null;
              }
              return { path: file.path, text };
            }

            const section = (text, heading) => {
              const after = text.split(new RegExp(`^## ${escape(heading)}\\s*$`, "m"))[1];
              return after ? after.split(/^## /m)[0].replace(/<!--[\s\S]*?-->/g, "").trim() : "";
            };

            async function specReady(number, sha) {
              const task = await taskFile(number, sha);
              if (!task) return null;
              if (!section(task.text, "Acceptance criteria")) {
                core.notice(`${task.path}: Acceptance criteria empty, grill not finished`);
                return null;
              }
              return task.path;
            }

            // `### ` blocks of `## Feedback`, with 1-based line range in the file
            const feedbackRounds = (text) => {
              const lines = text.split("\n");
              const start = lines.findIndex((l) => /^## Feedback\s*$/.test(l));
              if (start < 0) return [];
              const rounds = [];
              for (let i = start + 1; i < lines.length && !/^## /.test(lines[i]); i++) {
                if (/^### /.test(lines[i])) rounds.push({ from: i + 1, to: i + 1 });
                else if (rounds.length && lines[i].trim()) rounds[rounds.length - 1].to = i + 1;
              }
              return rounds.map((r) => ({ ...r, text: lines.slice(r.from - 1, r.to).join("\n") }));
            };

            // permalinks to rounds new since `before`; force push dropped `before` → last round only
            async function newFeedback(number, before, after) {
              const task = await taskFile(number, after);
              let rounds = task ? feedbackRounds(task.text) : [];
              if (!rounds.length) return [];
              const reachable = await github.rest.repos.getCommit({ owner, repo, ref: before })
                .then(() => true, (e) => { if ([404, 422].includes(e.status)) return false; throw e; });
              if (!reachable) rounds = rounds.slice(-1);
              else {
                const prev = await taskFile(number, before);
                const old = prev ? feedbackRounds(prev.text).map((r) => r.text) : [];
                rounds = rounds.filter((r) => !old.includes(r.text));
              }
              // bare ?plain=1 line permalink on its own line → GitHub embeds the snippet from the file
              return rounds.map((r) => `${context.serverUrl}/${owner}/${repo}/blob/${after}/${task.path}?plain=1#L${r.from}-L${r.to}`);
            }

            const event = context.eventName;
            const payload = context.payload;

            // PR → ticket: the one issue it links (Development link), else the one `Closes #n` its body names, else its
            // wa/<n>-… branch. Sprint parents and ignored issues are not tickets. GitHub turns `Closes #n` into a link
            // only on PRs onto the default branch: an open PR whose ticket came from its body or branch gets the
            // Development link here, so no worker links by hand.
            const NOT_TICKET = ["wa-ignore", SPRINT_LABEL];
            async function ticketOf(pr) {
              if (sprintPrefix && pr.head.ref.startsWith(sprintPrefix)) return null; // sprint PR: lands a sprint, not a ticket
              const data = await github.graphql(
                `query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){pullRequest(number:$n){
                  id closingIssuesReferences(first:10){nodes{number repository{nameWithOwner} labels(first:20){nodes{name}}}}}}}`,
                { o: owner, r: repo, n: pr.number });
              const node = data.repository.pullRequest;
              // another repository's issue (`Closes acme/lib#12`) is never this repository's #12
              const linked = node.closingIssuesReferences.nodes
                .filter((i) => i.repository.nameWithOwner === `${owner}/${repo}`)
                .filter((i) => !i.labels.nodes.some((l) => NOT_TICKET.includes(l.name)))
                .map((i) => i.number);
              const named = issueFromBranch(pr.head.ref);
              const several = async (numbers) => {
                await report(pr.number, "several-tickets",
                  `#${pr.number} links ${numbers.map((n) => `#${n}`).join(", ")}: a PR links exactly one ticket`);
                return null;
              };
              if (linked.length === 1) return linked[0];
              if (linked.length > 1) return named && linked.includes(named) ? named : several(linked);
              // keywords a reader sees: not in the run report, HTML comments or code
              const text = (pr.body ?? "").replace(/<!-- wa-report -->[\s\S]*?<!-- \/wa-report -->/g, "")
                .replace(/<!--[\s\S]*?-->/g, "").replace(/```[\s\S]*?```/g, "").replace(/`[^`\n]*`/g, "");
              const written = [...new Set([...text.matchAll(/(?<![\w/])(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?\s+#(\d+)\b/gi)]
                .map((m) => Number(m[1])))];
              if (written.length > 1) return several(written);
              const number = written[0] ?? named;
              if (!number) return null;
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: number }).catch((e) => {
                if (e.status === 404) return { data: null };
                throw e;
              });
              if (!issue || issue.pull_request || issue.labels.some((l) => NOT_TICKET.includes(l.name))) return null;
              if (pr.state === "open") {
                const mutation = `mutation($i:ID!,$p:[ID!]!){addCloseIssueReferences(input:{issueId:$i,pullRequestIds:$p}){clientMutationId}}`;
                await github.graphql(mutation, { i: issue.node_id, p: [node.id] })
                  .catch(() => projects.graphql(mutation, { i: issue.node_id, p: [node.id] }));
                core.info(`#${pr.number} linked to #${number} (Development)`);
              }
              return number;
            }

            // A PR linking its issue (GitHub's own link or ours) fires GitHub's built-in Project workflow "Pull request
            // linked to issue" a few seconds later: it moves the card to its own column once the claim is gone. Watch
            // the card a little and take it back once. Costs nothing extra: a run is billed as a whole minute anyway.
            async function holdAgainstBuiltIn(number, state) {
              for (let i = 0; i < 6; i++) {
                await new Promise((done) => setTimeout(done, 5000));
                const now = await item(number);
                if (now.column && !now.state) {
                  await setState(now, state);
                  core.info(`#${number} taken back from ${now.column}: built-in Project workflow, switch it off`);
                  return;
                }
              }
            }

            // Report-only: compare every ticket's card with what the repository says, comment what disagrees.
            async function check() {
              const p = await project();
              const query = `query($p:ID!,$after:String,$f:String!){node(id:$p){... on ProjectV2{items(first:50,after:$after){
                pageInfo{hasNextPage endCursor}
                nodes{ fieldValueByName(name:$f){... on ProjectV2ItemFieldSingleSelectValue{name}}
                  content{... on Issue{ number state stateReason body repository{nameWithOwner} labels(first:20){nodes{name}}
                    closedByPullRequestsReferences(first:10,includeClosedPrs:true){nodes{state repository{nameWithOwner}}}
                    linkedBranches(first:5){nodes{id}}
                    comments(last:100){nodes{databaseId body}} }}}}}}}`;
              const nodes = [];
              for (let after = null, more = true; more;) {
                const page = (await projects.graphql(query, { p: p.id, after, f: statusField })).node.items;
                nodes.push(...page.nodes);
                ({ hasNextPage: more, endCursor: after } = page.pageInfo);
              }
              const held = {};
              const claimRefs = {};
              for (const ref of await github.paginate(github.rest.git.listMatchingRefs, { owner, repo, ref: "wa-claims/" })) {
                const [, , n, phase] = ref.ref.split("/");
                (held[n] ??= []).push(phase);
                claimRefs[`${n}/${phase}`] = ref.object.sha;
              }
              const branches = new Map((await github.paginate(github.rest.git.listMatchingRefs, { owner, repo, ref: `heads/${prefix}` }))
                .map((ref) => [issueFromBranch(ref.ref.replace("refs/heads/", "")), ref.object.sha]));
              // A claim held with no push for WA_STALE_AFTER_HOURS: a round left open (local commits only, a branch
              // pushed with no PR, a worker gone). Same rule as `wa-backlog claims`: last activity = claim or branch head.
              const staleHours = Number(env.WA_STALE_AFTER_HOURS || 24);
              async function stale(n, phase) {
                const { data: claim } = await github.rest.git.getCommit({ owner, repo, commit_sha: claimRefs[`${n}/${phase}`] });
                let latest = Date.parse(claim.committer.date);
                if (branches.has(n)) {
                  const { data: head } = await github.rest.git.getCommit({ owner, repo, commit_sha: branches.get(n) });
                  latest = Math.max(latest, Date.parse(head.committer.date));
                }
                const hours = Math.floor((Date.now() - latest) / 3600000);
                if (hours < staleHours) return null;
                const agent = /^agent: (.+)$/m.exec(claim.message)?.[1] ?? "?";
                return { agent, hours };
              }
              // PRs known by branch name only (opened before the hooks linked them) still count as open
              const openByBranch = new Set((await github.paginate(github.rest.pulls.list, { owner, repo, state: "open", per_page: 100 }))
                .map((pr) => issueFromBranch(pr.head.ref)));
              const found = [];
              for (const node of nodes) {
                const issue = node.content;
                if (!issue?.number || issue.repository.nameWithOwner !== `${owner}/${repo}`) continue;
                if (issue.labels.nodes.some((l) => ["wa-ignore", SPRINT_LABEL].includes(l.name))) continue;
                const state = Object.keys(states).find((s) => states[s] === node.fieldValueByName?.name);
                if (!state) continue; // no card status, or a column whackagent doesn't own
                const n = issue.number;
                const problems = {};
                if (issue.state === "CLOSED") {
                  // closed = landed or canceled; only an open lock column is wrong there
                  if (["grilling", "coding"].includes(state)) problems["closed-locked"] = `#${n} is closed but its card sits in \`${state}\``;
                  else if (issue.stateReason === "COMPLETED" && state !== "done") problems["closed-not-done"] = `#${n} is closed as completed but its card sits in \`${state}\``;
                } else {
                  const prs = issue.closedByPullRequestsReferences.nodes.filter((pr) => pr.repository.nameWithOwner === `${owner}/${repo}`);
                  const open = prs.some((pr) => pr.state === "OPEN") || openByBranch.has(n);
                  const merged = prs.some((pr) => pr.state === "MERGED");
                  const bodySpec = !!section(issue.body ?? "", "Acceptance criteria");
                  const spec = bodySpec || issue.linkedBranches.nodes.length > 0 || branches.has(n);
                  const claims = held[n] ?? [];
                  if (["grilling", "coding"].includes(state) && !claims.includes(state))
                    problems["lock-no-claim"] = `card in \`${state}\` but nobody holds a ${state} claim: claim it before working, or a human runs \`release ${n} ${state} --reset-to <state>\``;
                  for (const phase of claims) {
                    const old = await stale(n, phase);
                    // age = newest of claim time and branch head commit date (not push time)
                    const ends = phase === "grilling" ? "writes the spec or releases" : "opens the PR or releases";
                    if (old) problems[`stale-${phase}`] = `${phase} claim held by ${old.agent}, nothing new for ${old.hours} h: its holder ${ends}; only a human clears it for them (\`release ${n} ${phase} --reset-to <state> --reason "stale: …"\`)`;
                  }
                  if (state === "done") problems["done-open"] = `card in \`done\` but the issue is still open`;
                  if (state !== "done" && merged && !open) problems["merged-not-done"] = `a linked PR is merged but the card sits in \`${state}\``;
                  if (state === "review" && !open) problems["review-no-pr"] = `card in \`review\` but no open PR links this ticket`;
                  if (["todo", "grilled"].includes(state) && open) problems["pr-not-review"] = `a linked PR is open but the card sits in \`${state}\``;
                  if (state === "grilled" && !spec) problems["grilled-no-spec"] = `card in \`grilled\` but no spec: no \`## Acceptance criteria\` in the issue body, no ticket branch`;
                  if (state === "todo" && bodySpec) problems["spec-todo"] = `the issue body holds acceptance criteria but the card sits in \`todo\``;
                }
                const comments = issue.comments.nodes;
                for (const [kind, text] of Object.entries(problems)) {
                  found.push([`#${n}`, text]);
                  await report(n, kind, text, comments);
                }
                for (const c of comments) {
                  const kind = /<!-- board-check:([a-z-]+) -->/.exec(c.body ?? "")?.[1];
                  if (kind && !problems[kind]) await resolve(c.databaseId, c.body, kind);
                }
              }
              core.summary.addHeading("Board check", 3);
              if (found.length) core.summary.addTable([[{ data: "Ticket", header: true }, { data: "Problem", header: true }], ...found]);
              else core.summary.addRaw("Board matches the repository.");
              await core.summary.write();
            }

            if (event === "schedule" || event === "workflow_dispatch") {
              await check();
              return;
            }

            if (event === "issues") {
              const issue = payload.issue;
              if (issue.pull_request) return;
              if (issue.labels.some((l) => ["wa-ignore", SPRINT_LABEL].includes(l.name))) return;
              if (payload.action === "edited" && !payload.changes?.body) return; // title-only edit
              const ticket = await item(issue.number);
              if (!ticket.column) {
                await setState(ticket, "todo");
                ticket.state = "todo";
              }
              // spec in the issue body: written in one edit at the end of a grill, or by a human on a todo ticket
              if (!["todo", "grilling"].includes(ticket.state) || !section(issue.body ?? "", "Acceptance criteria")) return;
              // only from someone who can push: an outsider's text never becomes a spec an agent codes unattended
              const { data: access } = await github.rest.repos.getCollaboratorPermissionLevel(
                { owner, repo, username: payload.sender.login }).catch(() => ({ data: { permission: "none" } }));
              if (!["admin", "maintain", "write"].includes(access.permission)) {
                await report(issue.number, "spec-todo",
                  `acceptance criteria written by @${payload.sender.login}, who can't push here: a maintainer edits the issue body to accept them as the spec`);
                return;
              }
              await setState(ticket, "grilled");
              await release(issue.number, "grilling");
              await comment(issue.number, `✅ **grilled** — spec in the issue body`);
              return;
            }

            if (event === "push") {
              if (payload.deleted) return;
              const branch = context.ref.replace("refs/heads/", "");
              const number = issueFromBranch(branch);
              if (!number) return;
              const spec = await specReady(number, payload.after);
              if (!spec) return;
              const ticket = await item(number);
              if (ticket.column && !["todo", "grilling"].includes(ticket.state)) return;
              await setState(ticket, "grilled");
              await release(number, "grilling");
              // sha permalink: the branch is deleted on merge, the commit stays
              const specUrl = `${context.serverUrl}/${owner}/${repo}/blob/${payload.after}/${spec}`;
              const name = spec.split("/").pop();
              await comment(number, `✅ **grilled** — spec [\`${name}\`](${specUrl}) on \`${branch}\``);
              return;
            }

            if (event === "pull_request") {
              const pr = payload.pull_request;
              if (pr.head.repo?.full_name !== pr.base.repo.full_name) return;
              const number = await ticketOf(pr);
              if (!number) {
                // sprint branch landed → its parent issue closes
                if (!sprintPrefix || !pr.head.ref.startsWith(sprintPrefix) || payload.action !== "closed" || !pr.merged) return;
                const name = pr.head.ref.slice(sprintPrefix.length);
                const { data: open } = await github.rest.issues.listForRepo({ owner, repo, labels: SPRINT_LABEL, state: "open", per_page: 100 });
                const parent = open.find((i) => sprintName(i.title) === name && !i.pull_request);
                if (parent) await closeSprint(parent.number, `#${pr.number} merged \`${pr.head.ref}\` into \`${pr.base.ref}\``);
                return;
              }
              const ticket = await item(number);
              const action = payload.action;
              // A column outside the six states is a human's choice (Blocked, …): hands off. Except when a coding
              // claim is held: GitHub's built-in Project workflow "Pull request linked to issue" moves the card to its
              // own column the moment a PR links it, and the claim proves a contract round is running.
              let reclaimed = false;
              if (ticket.column && !ticket.state) {
                reclaimed = ["opened", "reopened", "edited", "synchronize"].includes(action) && await claimExists(number, "coding");
                if (!reclaimed) {
                  core.info(`#${number} sits in column ${ticket.column}, not a whackagent state: untouched`);
                  return;
                }
                core.info(`#${number} sits in column ${ticket.column} while a coding claim is held: taken back`);
                ticket.state = "coding";
              }

              if (action === "opened" || action === "reopened") {
                if (ticket.state === "done") return;
                await setState(ticket, "review");
                await release(number, "coding");
                await release(number, "grilling");
                const kind = pr.draft ? "draft " : "";
                await comment(number, `🔀 **review** — ${kind}#${pr.number} → \`${pr.base.ref}\``);
                await holdAgainstBuiltIn(number, "review");
                return;
              }

              if (action === "edited") {
                // link added after `opened` (refreshed body with `Closes #n`): the board learns of the PR late.
                // Never from `coding`: an agent may be mid-round on a PR already known.
                if (pr.state !== "open" || !(reclaimed || ["todo", "grilled"].includes(ticket.state))) return;
                await setState(ticket, "review");
                await release(number, "coding");
                await comment(number, `🔀 **review** — ${pr.draft ? "draft " : ""}#${pr.number} → \`${pr.base.ref}\``);
                await holdAgainstBuiltIn(number, "review");
                return;
              }

              if (action === "ready_for_review" || action === "converted_to_draft") {
                // draft ↔ ready changes who looks next (tester or merger), not the state. Never touches the
                // claim: an agent mid-round may flip it (`gh pr ready --undo` before a fix), its push ends the round.
                if (action === "ready_for_review" && ticket.state !== "done") {
                  await comment(number, `✅ **ready** — #${pr.number} ready to merge`);
                }
                return;
              }

              if (action === "synchronize") {
                if (!(await claimExists(number, "coding"))) {
                  // no round open: a push nobody claimed. GitHub's own merges (Update branch button) are fine.
                  if (ticket.state === "done") return;
                  const { data: head } = await github.rest.repos.getCommit({ owner, repo, ref: payload.after });
                  if (head.committer?.login === "web-flow") return;
                  await report(pr.number, `push-no-claim-${payload.after.slice(0, 7)}`,
                    `push ${payload.after.slice(0, 7)} to #${pr.number} while #${number} holds no coding claim: claim before changing a ticket's code, every round`);
                  return;
                }
                await setState(ticket, "review");
                await release(number, "coding");
                const rounds = await newFeedback(number, payload.before, payload.after);
                const notes = rounds.length ? `\n\n${rounds.join("\n\n")}` : "";
                await comment(number, `🔀 **review** — round pushed to #${pr.number}${notes}`);
                if (notes) {
                  const body = `📝 **feedback** — round pushed for #${number}${notes}`;
                  // caller template < 15 grants pull-requests: read only → post with the PAT instead
                  await comment(pr.number, body).catch((e) => {
                    if (e.status !== 403) throw e;
                    return projects.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
                  });
                }
                return;
              }

              if (action === "closed" && pr.merged) {
                // mid-stack PR keeps its parent branch as base; a stack merge lands it on the stack base
                const landed = pr.stack?.base?.ref ?? pr.base.ref;
                await setState(ticket, "done");
                await release(number, "grilling");
                await release(number, "coding");
                if (ticket.issue.state === "open") await closeIssue(number);
                // run report: local file the skills copy into the PR body, posted only when there
                const report = /<!-- wa-report -->([\s\S]*?)<!-- \/wa-report -->/.exec(pr.body ?? "")?.[1].trim();
                await comment(number, `🎉 **done** — #${pr.number} merged into \`${landed}\`${report ? `\n\n${report}` : ""}`);
                // Sprint without branch: tickets land straight on the target, so the last one lands the sprint.
                // With a branch, they land in it and the sprint lands with the sprint branch PR (above).
                const parent = await sprintParent(number);
                if (parent && parent.state === "OPEN" && landed !== sprintPrefix + sprintName(parent.title)) {
                  const { data: subs } = await github.request("GET /repos/{owner}/{repo}/issues/{issue_number}/sub_issues",
                    { owner, repo, issue_number: parent.number, per_page: 100 });
                  if (subs.every((s) => s.state === "closed")) await closeSprint(parent.number, `last ticket #${number} landed`);
                }
                return;
              }

              if (action === "closed") {
                if (ticket.state === "done") return;
                // another round is live (a coding claim, or another open PR for the ticket): this PR was superseded
                if (await claimExists(number, "coding")) return;
                const { repository: { issue: refs } } = await github.graphql(
                  `query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){issue(number:$n){
                    closedByPullRequestsReferences(first:10){nodes{number state}}}}}`, { o: owner, r: repo, n: number });
                if (refs.closedByPullRequestsReferences.nodes.some((p) => p.state === "OPEN" && p.number !== pr.number)) return;
                await setState(ticket, "grilled");
                await release(number, "coding");
                await comment(number, `↩️ **grilled** — #${pr.number} closed unmerged, spec kept`);
              }
            }
