# whackagent board hooks (Plane) — template version: 1
# Installed by /wa-setup from the whackagent plugin (templates/plane-board.yml).
# Moves work items on the Plane project from repository events, so the board follows the task files:
#   push to wa/<n>-<slug>                   → state = `status:` of {tasks}/<n>-<slug>.md on that push
#                                             (todo · to-test · to-close), releases the claim the round held
#   PR merged (any base)                    → Done, claims dropped, module completed when all its items are settled
#   PR closed unmerged                      → Todo (spec kept on its branch)
# Work items created in Plane land in Draft: it is the project's default state.
# The task file is the truth once its branch exists. Agents write only the locks (Grilling, Coding)
# and Canceled; every other state comes from here.
# Settings are repository variables written by `plane-board provision`. Plane writes need the
# WA_PLANE_TOKEN secret (a Plane API key). Claims are git refs: GITHUB_TOKEN drops them.
# Custom branch prefix? Change the `branches` filter below to match WA_BRANCH_PREFIX.

name: whackagent board

on:
  push:
    branches: ["wa/**"]
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: whackagent-board-${{ github.head_ref || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  board:
    if: vars.WA_PLANE_PROJECT_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          WA_PLANE_TOKEN: ${{ secrets.WA_PLANE_TOKEN }}
          WA_PLANE_PROJECT_URL: ${{ vars.WA_PLANE_PROJECT_URL }}
          WA_STATES: ${{ vars.WA_STATES }}
          WA_TASKS_PATH: ${{ vars.WA_TASKS_PATH }}
          WA_BRANCH_PREFIX: ${{ vars.WA_BRANCH_PREFIX }}
        with:
          script: |
            const env = process.env;
            if (!env.WA_PLANE_TOKEN) {
              core.setFailed("WA_PLANE_TOKEN secret missing: a Plane API key (Profile settings → Personal access tokens)");
              return;
            }
            const { owner, repo } = context.repo;
            const prefix = env.WA_BRANCH_PREFIX || "wa/";
            const tasksPath = (env.WA_TASKS_PATH || ".whackagent/tasks").replace(/\/$/, "");
            const states = {
              draft: "Draft", grilling: "Grilling", todo: "Todo", coding: "Coding",
              "to-test": "To test", "to-close": "To close", done: "Done", canceled: "Canceled",
              ...JSON.parse(env.WA_STATES || "{}"),
            };
            const fromFile = ["todo", "to-test", "to-close"];
            const settled = ["done", "canceled"];

            const url = new URL(env.WA_PLANE_PROJECT_URL);
            const [, slug, , projectId] = url.pathname.split("/");
            // Plane Cloud serves the API on its own host; self-hosted serves app and API on one.
            const api = `${url.host === "app.plane.so" ? "https://api.plane.so" : url.origin}/api/v1/`;
            const projectPath = `workspaces/${slug}/projects/${projectId}/`;

            async function plane(method, path, body) {
              for (let attempt = 0; attempt < 2; attempt++) {
                const res = await fetch(api + path, {
                  method,
                  headers: { "X-API-Key": env.WA_PLANE_TOKEN, "Content-Type": "application/json", Accept: "application/json" },
                  body: body ? JSON.stringify(body) : undefined,
                });
                if (res.status === 429 && attempt === 0) { await new Promise((r) => setTimeout(r, 30000)); continue; }
                const text = await res.text();
                if (!res.ok) throw Object.assign(new Error(`plane ${method} ${path}: ${res.status} ${text.slice(0, 300)}`), { status: res.status });
                return text ? JSON.parse(text) : null;
              }
            }
            const rows = (page) => (Array.isArray(page) ? page : page.results || []);

            const escape = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const issueFromBranch = (branch) => {
              const match = branch.match(new RegExp(`^${escape(prefix)}(\\d+)-`));
              return match ? Number(match[1]) : null;
            };

            let projectCache;
            async function project() {
              if (projectCache) return projectCache;
              const p = await plane("GET", projectPath);
              const list = rows(await plane("GET", `${projectPath}states/?per_page=100`));
              const byName = Object.fromEntries(list.map((s) => [s.name, s.id]));
              let items = "work-items";
              try { await plane("GET", `${projectPath}work-items/?per_page=1`); } catch (e) { items = "issues"; }
              projectCache = { identifier: p.identifier, byName, byId: Object.fromEntries(list.map((s) => [s.id, s.name])), items };
              return projectCache;
            }

            async function item(number) {
              const p = await project();
              const node = await plane("GET", `workspaces/${slug}/${p.items}/${p.identifier}-${number}/`);
              const current = p.byId[node.state];
              const state = Object.keys(states).find((s) => states[s] === current) || null;
              // state null = a Plane state whackagent doesn't own (Blocked, …): hands off
              return { id: node.id, number, key: `${p.identifier}-${number}`, state, column: current || null };
            }

            async function setState(ticket, state) {
              const p = await project();
              await plane("PATCH", `${projectPath}${p.items}/${ticket.id}/`, { state: p.byName[states[state]] });
              core.info(`${ticket.key}: ${ticket.state ?? "none"} → ${state}`);
            }

            async function release(number, phase) {
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `wa-claims/${number}/${phase}` });
              } catch (e) { if (![404, 422].includes(e.status)) throw e; }
            }

            async function comment(ticket, html) {
              const p = await project();
              await plane("POST", `${projectPath}${p.items}/${ticket.id}/comments/`, { comment_html: `<p>${html}</p>` });
            }

            // Module holding the item, completed once none of its items is left to do.
            async function closeModule(ticket) {
              const p = await project();
              const done = [p.byName[states.done], p.byName[states.canceled]];
              for (const module of rows(await plane("GET", `${projectPath}modules/?per_page=100`))) {
                const members = rows(await plane("GET", `${projectPath}modules/${module.id}/module-issues/?per_page=100`));
                if (!members.some((m) => m.id === ticket.id)) continue;
                if (module.status !== "completed" && members.every((m) => m.id === ticket.id || done.includes(m.state))) {
                  await plane("PATCH", `${projectPath}modules/${module.id}/`, { status: "completed" });
                  core.info(`module ${module.name} completed`);
                }
              }
            }

            // The task file for <number> at sha: its path and `status:`, or null when absent, not this
            // item's, or not grilled yet (empty acceptance criteria).
            async function taskFile(number, sha) {
              let listing;
              try {
                ({ data: listing } = await github.rest.repos.getContent({ owner, repo, path: tasksPath, ref: sha }));
              } catch (e) { if (e.status === 404) return null; throw e; }
              const file = (Array.isArray(listing) ? listing : []).find((f) => new RegExp(`^${number}-.*\\.md$`).test(f.name));
              if (!file) return null;
              const { data } = await github.rest.repos.getContent({ owner, repo, path: file.path, ref: sha });
              const text = Buffer.from(data.content, "base64").toString("utf8");
              if (!new RegExp(`^issue:\\s*(#|[A-Za-z][A-Za-z0-9]*-)?${number}\\s*$`, "m").test(text)) {
                core.notice(`${file.path}: frontmatter issue: does not match ${number}`);
                return null;
              }
              const section = text.split(/^## Acceptance criteria\s*$/m)[1];
              const criteria = section ? section.split(/^## /m)[0].replace(/<!--[\s\S]*?-->/g, "").trim() : "";
              if (!criteria) {
                core.notice(`${file.path}: Acceptance criteria empty, grill not finished`);
                return null;
              }
              const status = (text.match(/^status:\s*([a-z-]+)/m) || [])[1] || null;
              return { path: file.path, status };
            }

            const event = context.eventName;
            const payload = context.payload;

            if (event === "push") {
              if (payload.deleted) return;
              const branch = context.ref.replace("refs/heads/", "");
              const number = issueFromBranch(branch);
              if (!number) return;
              const file = await taskFile(number, payload.after);
              if (!file || !fromFile.includes(file.status)) return;
              const ticket = await item(number);
              if (ticket.column && !ticket.state) return;
              if (settled.includes(ticket.state)) return;
              // The push ends whichever round was running: grill (→ todo) or coding round (→ to-test / to-close).
              await release(number, "grilling");
              await release(number, "coding");
              if (ticket.state === file.status) return;
              await setState(ticket, file.status);
              // sha permalink: the branch is deleted on merge, the commit stays
              const link = `${context.serverUrl}/${owner}/${repo}/blob/${payload.after}/${file.path}`;
              const name = file.path.split("/").pop();
              const lines = {
                todo: `✅ <strong>grilled</strong> — spec <a href="${link}">${name}</a> on <code>${branch}</code>`,
                "to-test": `🧪 <strong>to test</strong> — <a href="${link}">${name}</a>`,
                "to-close": `🏁 <strong>to close</strong> — verifier passed, retest then close`,
              };
              await comment(ticket, lines[file.status]);
              return;
            }

            if (event === "pull_request") {
              const pr = payload.pull_request;
              if (pr.head.repo?.full_name !== pr.base.repo.full_name) return;
              const number = issueFromBranch(pr.head.ref);
              if (!number) return;
              const ticket = await item(number);
              if (ticket.column && !ticket.state) {
                core.info(`${ticket.key} sits in state ${ticket.column}, not a whackagent state: untouched`);
                return;
              }

              if (pr.merged) {
                await setState(ticket, "done");
                await release(number, "grilling");
                await release(number, "coding");
                await comment(ticket, `🎉 <strong>done</strong> — <a href="${pr.html_url}">#${pr.number}</a> merged into <code>${pr.base.ref}</code>`);
                await closeModule(ticket);
                return;
              }

              if (settled.includes(ticket.state)) return;
              await setState(ticket, "todo");
              await release(number, "coding");
              await comment(ticket, `↩️ <strong>todo</strong> — <a href="${pr.html_url}">#${pr.number}</a> closed unmerged, spec kept on <code>${pr.head.ref}</code>`);
            }
